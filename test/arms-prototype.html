<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Prototype: Arms อ่อนแรง (Pose warp)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#1B3B9B;--blue-d:#0d2266;--orange:#F5831F;--danger:#c0392b;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{font-family:'Sarabun',sans-serif;background:#000;color:#fff;overflow:hidden;}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:#000;}
.font-n{font-family:'Nunito',sans-serif;}

/* ---- intro ---- */
.intro{position:absolute;inset:0;z-index:20;background:linear-gradient(160deg,var(--blue),var(--blue-d));
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:28px;text-align:center;}
.intro h1{font-size:24px;font-weight:900;}
.intro h1 span{color:var(--orange);}
.intro p{font-size:15px;line-height:1.7;color:rgba(255,255,255,.82);max-width:330px;}
.tag{display:inline-block;background:rgba(245,131,31,.16);border:1px solid rgba(245,131,31,.45);
  border-radius:12px;padding:9px 16px;font-size:13px;color:#fff;}
.btn{min-height:54px;border-radius:16px;border:none;cursor:pointer;font-family:'Sarabun';font-size:16px;font-weight:700;
  color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 26px;
  background:linear-gradient(135deg,var(--orange),#ff9a45);box-shadow:0 6px 22px rgba(245,131,31,.4);}
.btn.blue{background:linear-gradient(135deg,var(--blue),#2952d3);box-shadow:0 6px 22px rgba(27,59,155,.4);}
.btn.ghost{background:rgba(255,255,255,.14);box-shadow:none;}
.btn.sm{min-height:44px;font-size:14px;border-radius:13px;padding:10px 18px;}

/* ---- camera ---- */
.cam{position:absolute;inset:0;background:#000;overflow:hidden;}
.cam canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.top{position:absolute;top:0;left:0;right:0;z-index:15;display:flex;align-items:center;justify-content:space-between;
  padding:calc(12px + env(safe-area-inset-top)) 16px 22px;background:linear-gradient(to bottom,rgba(0,0,0,.75),transparent);}
.top b{font-size:16px;}
.top small{display:block;color:rgba(255,255,255,.65);font-size:12px;}
.round{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.2);border:none;color:#fff;font-size:20px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.bottom{position:absolute;bottom:0;left:0;right:0;z-index:15;padding:16px 16px calc(18px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,rgba(0,0,0,.82),transparent);}
.seg{display:flex;gap:6px;background:rgba(0,0,0,.4);border-radius:12px;padding:5px;margin-bottom:12px;}
.seg button{flex:1;border:none;background:transparent;color:rgba(255,255,255,.7);font-family:'Sarabun';font-weight:700;
  font-size:14px;padding:10px 4px;border-radius:9px;cursor:pointer;}
.seg button.on{background:var(--orange);color:#fff;}
.ctl label{display:flex;justify-content:space-between;font-size:12px;opacity:.85;margin-bottom:5px;}
input[type=range]{width:100%;accent-color:var(--orange);height:24px;}
.row{display:flex;gap:10px;margin-top:10px;}
.row .btn{flex:1;}
.spin{width:26px;height:26px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite;}
@keyframes sp{to{transform:rotate(360deg)}}
.disc{font-size:10.5px;color:rgba(255,255,255,.5);text-align:center;line-height:1.5;margin-top:10px;}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
const app=document.getElementById('app');
function h(tag,props,...kids){const e=document.createElement(tag);
  if(props)for(const k in props){
    if(k==='style')Object.assign(e.style,props[k]);
    else if(k==='class')e.className=props[k];
    else if(k.startsWith('on')&&typeof props[k]==='function')e.addEventListener(k.slice(2).toLowerCase(),props[k]);
    else if(k==='html')e.innerHTML=props[k];
    else if(props[k]!=null)e.setAttribute(k,props[k]);
  }
  for(const kid of kids.flat()){if(kid==null||kid===false)continue;e.append(kid.nodeType?kid:document.createTextNode(kid));}
  return e;}

/* ---------- media ---------- */
let _stream=null,_raf=0;
function stopAll(){if(_raf){cancelAnimationFrame(_raf);_raf=0;}if(_stream){_stream.getTracks().forEach(t=>t.stop());_stream=null;}}
window.addEventListener('pagehide',stopAll);
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopAll();});

/* ---------- MediaPipe Pose loader (เหมือนแอปหลัก) ---------- */
let _visionMod=null,_poseLM=null;
const MPV='0.10.20';
const POSE_URL='https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task';
async function loadVision(){if(_visionMod)return _visionMod;_visionMod=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@'+MPV);return _visionMod;}
async function getPoseLM(){if(_poseLM)return _poseLM;const v=await loadVision();
  const fs=await v.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@'+MPV+'/wasm');
  const mk=d=>v.PoseLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:POSE_URL,delegate:d},runningMode:'VIDEO',numPoses:1});
  try{_poseLM=await mk('GPU');}catch(e){_poseLM=await mk('CPU');}
  return _poseLM;}
const NET_MSG=(location.protocol==='file:')?'ต้องเปิดผ่านลิงก์เว็บ (https) ไม่ใช่เปิดไฟล์ในเครื่อง':'โหลดตัวตรวจจับไม่ได้ — ตรวจสอบอินเทอร์เน็ต';

/* ---------- canvas helpers (เหมือนแอปหลัก) ---------- */
function syncCanvas(cv){const dpr=Math.min(2,window.devicePixelRatio||1);
  const w=Math.round((cv.clientWidth||cv.parentElement.clientWidth)*dpr);
  const hh=Math.round((cv.clientHeight||cv.parentElement.clientHeight)*dpr);
  if(w>1&&hh>1&&(cv.width!==w||cv.height!==hh)){cv.width=w;cv.height=hh;}}
function drawCover(ctx,video,W,H,zoom,mirror){
  const vw=video.videoWidth,vh=video.videoHeight;if(!vw||!vh)return null;
  const scale=Math.max(W/vw,H/vh)*(zoom||1);
  const dw=vw*scale,dh=vh*scale,dx=(W-dw)/2,dy=(H-dh)/2;
  ctx.save();
  if(mirror){ctx.translate(W,0);ctx.scale(-1,1);ctx.drawImage(video,dx,dy,dw,dh);}
  else ctx.drawImage(video,dx,dy,dw,dh);
  ctx.restore();
  return {dx,dy,dw,dh,mirror,W};}
function mapPt(m,nx,ny){const x=m.dx+nx*m.dw;return{x:m.mirror?(m.W-x):x,y:m.dy+ny*m.dh};}
/* triangle texture warp (เหมือนแอปหลัก) */
function drawTriTex(ctx,img,s,d){
  const [s0,s1,s2]=s,[d0,d1,d2]=d;
  ctx.save();ctx.beginPath();ctx.moveTo(d0.x,d0.y);ctx.lineTo(d1.x,d1.y);ctx.lineTo(d2.x,d2.y);ctx.closePath();ctx.clip();
  const x0=s0.x,y0=s0.y,x1=s1.x,y1=s1.y,x2=s2.x,y2=s2.y;
  const u0=d0.x,v0=d0.y,u1=d1.x,v1=d1.y,u2=d2.x,v2=d2.y;
  const den=x0*(y1-y2)+x1*(y2-y0)+x2*(y0-y1);
  if(Math.abs(den)<1e-6){ctx.restore();return;}
  const a=(u0*(y1-y2)+u1*(y2-y0)+u2*(y0-y1))/den;
  const b=(v0*(y1-y2)+v1*(y2-y0)+v2*(y0-y1))/den;
  const c=(u0*(x2-x1)+u1*(x0-x2)+u2*(x1-x0))/den;
  const dd=(v0*(x2-x1)+v1*(x0-x2)+v2*(x1-x0))/den;
  const e=(u0*(x1*y2-x2*y1)+u1*(x2*y0-x0*y2)+u2*(x0*y1-x1*y0))/den;
  const f=(v0*(x1*y2-x2*y1)+v1*(x2*y0-x0*y2)+v2*(x0*y1-x1*y0))/den;
  ctx.setTransform(a,b,c,dd,e,f);ctx.drawImage(img,0,0);ctx.restore();
  ctx.setTransform(1,0,0,1,0,0);}

/* ============================ INTRO ============================ */
function showIntro(){
  stopAll();
  app.innerHTML='';
  app.append(h('div',{class:'intro'},
    h('div',{class:'tag'},'🧪 เวอร์ชันทดลอง — โมดูล Arms'),
    h('h1',{html:'จำลอง<span> แขนอ่อนแรง</span><br>ด้วยหลักการเดียวกับ Face'}),
    h('p',null,'วางแขนแนบลำตัวทั้งสองข้าง หันหน้าเข้ากล้องให้เห็นช่วงลำตัว แล้วระบบจะ “ดึงแขน” ข้างที่เลือกให้ค่อยๆ ตกลง (เหมือนดึงมุมปากในโหมด Face) โดยไม่ต้องยกแขน'),
    h('p',{style:{fontSize:'13px',opacity:.7}},'ใช้ MediaPipe Pose อย่างเดียว · ประมวลผลในเครื่อง 100% · ต้องเปิดผ่าน HTTPS'),
    h('button',{class:'btn',html:'📷 เปิดกล้องทดสอบ',onclick:launchArms}),
  ));
}

/* ============================ CAMERA + ARM WARP ============================ */
function launchArms(){
  stopAll();
  app.innerHTML='';
  const canvas=h('canvas');
  const video=h('video',{playsinline:'true',muted:'true',autoplay:'true',style:{opacity:0,position:'absolute',width:'1px',height:'1px'}});
  const cam=h('div',{class:'cam'},canvas,video);

  // controls — เลือกได้แค่ ซ้าย/ขวา (ค่าอาการตกคงที่ ชัดเจน)
  let side='right';       // ข้างจอที่แขนจะตก (ซ้าย/ขวา ตามที่ผู้ใช้เห็น)
  const DROOP=0.75;       // ความรุนแรงคงที่ (ตกชัดเจน)
  const seg=h('div',{class:'seg'});
  [['left','แขนซ้ายตก'],['right','แขนขวาตก']].forEach(([k,l])=>{
    const b=h('button',{class:side===k?'on':'',onclick:()=>{side=k;[...seg.children].forEach(c=>c.className='');b.className='on';replay();}},l);
    seg.append(b);
  });
  const statusEl=h('small',null,'กำลังโหลดตัวตรวจจับท่าทาง...');

  const top=h('div',{class:'top'},
    h('button',{class:'round',html:'‹',onclick:showIntro}),
    h('div',{style:{textAlign:'center'}},h('b',null,'🤲 จำลองแขนอ่อนแรง'),statusEl),
    h('div',{style:{width:'44px'}}));
  const bottom=h('div',{class:'bottom'},seg);   // เหลือแค่ปุ่มเลือกซ้าย/ขวา (กลับใช้ปุ่ม ‹ มุมซ้ายบน)
  // ป้ายข้อความเป็น HTML element (กล่อง+ข้อความก้อนเดียว จัดกึ่งกลางเป๊ะ ไม่เหลื่อม)
  const bannerEl=h('div',{style:{position:'absolute',top:'13%',left:'50%',transform:'translateX(-50%)',
    maxWidth:'86%',padding:'9px 18px',borderRadius:'13px',background:'rgba(0,0,0,.55)',color:'#fff',
    fontFamily:'Sarabun,sans-serif',fontWeight:'700',fontSize:'clamp(15px,4.6vw,24px)',textAlign:'center',
    zIndex:14,pointerEvents:'none',lineHeight:1.3,whiteSpace:'nowrap'}});

  app.append(cam,bannerEl,top,bottom);

  // ---- warp state ----
  let lm=null,map=null,ready=false,useMP=true;
  let droopT=0,lastTs=0;
  function replay(){droopT=0;lastTs=0;}   // เรียกเมื่อสลับซ้าย/ขวา ให้เริ่มจำลองใหม่

  const cctx=canvas.getContext('2d');
  const tmp=document.createElement('canvas');const tctx=tmp.getContext('2d');
  function P(i){const p=lm[i];return mapPt(map,p.x,p.y);}
  function banner(msg,warn){                 // อัปเดตป้าย HTML (จัดกึ่งกลางเป๊ะเสมอ)
    bannerEl.style.display='block';
    bannerEl.textContent=msg;
    bannerEl.style.background=warn?'rgba(245,131,31,.96)':'rgba(0,0,0,.55)';
  }
  function netError(){
    bannerEl.style.display='none';
    const W=canvas.width,H=canvas.height;
    cctx.setTransform(1,0,0,1,0,0);cctx.fillStyle='rgba(0,0,0,.6)';cctx.fillRect(0,H*0.40,W,H*0.20);
    cctx.fillStyle='#fff';cctx.textAlign='center';cctx.textBaseline='alphabetic';cctx.font='700 '+Math.round(H*0.03)+'px Sarabun';
    const lines=(location.protocol==='file:')?['⚠️ เปิดผ่านลิงก์เว็บ (https)','ไม่ใช่เปิดไฟล์ในเครื่อง']:['⚠️ โหลดตัวตรวจจับไม่ได้','ตรวจสอบอินเทอร์เน็ต'];
    cctx.fillText(lines[0],W/2,H*0.48);cctx.fillText(lines[1],W/2,H*0.48+H*0.05);
  }

  function frame(ts){
    syncCanvas(canvas);
    const W=canvas.width,H=canvas.height;
    if(tmp.width!==W){tmp.width=W;tmp.height=H;}
    if(useMP&&ready&&_poseLM){try{const r=_poseLM.detectForVideo(video,performance.now());if(r&&r.landmarks&&r.landmarks[0])lm=r.landmarks[0];}catch(e){}}
    cctx.setTransform(1,0,0,1,0,0);cctx.clearRect(0,0,W,H);
    map=drawCover(cctx,video,W,H,1,true);
    if(!map){_raf=requestAnimationFrame(frame);return;}
    if(!useMP){if(ready)netError();_raf=requestAnimationFrame(frame);return;}
    if(!ready){banner('กำลังโหลดตัวตรวจจับ...');_raf=requestAnimationFrame(frame);return;}
    if(!lm){banner('ยืนให้กล้องเห็นช่วงลำตัวและแขน');_raf=requestAnimationFrame(frame);return;}

    // advance progressive droop (0 -> 1 over ~2.4s)
    if(!lastTs)lastTs=ts;const dt=Math.min(0.05,(ts-lastTs)/1000);lastTs=ts;
    droopT=Math.min(1,droopT+dt/2.4);
    const e=droopT<0.5?2*droopT*droopT:1-Math.pow(-2*droopT+2,2)/2;   // easeInOut

    // landmarks -> canvas
    const L={sh:P(11),el:P(13),wr:P(15),hip:P(23)};
    const R={sh:P(12),el:P(14),wr:P(16),hip:P(24)};
    const arms=[L,R].sort((a,b)=>a.sh.x-b.sh.x);   // [0]=ซ้ายจอ, [1]=ขวาจอ
    const arm=side==='left'?arms[0]:arms[1];
    const bodyCx=(L.sh.x+R.sh.x)/2;
    const shoulderW=Math.abs(L.sh.x-R.sh.x)||W*0.30;
    const armHalfW=Math.max(W*0.055,shoulderW*0.26);
    const topY=arm.sh.y-shoulderW*0.22;   // มาร์คสูงขึ้นถึงบนหัวไหล่ (กันไหล่ขาด)
    const bottomY=Math.max(arm.wr.y,arm.hip.y)+shoulderW*0.18;
    const armLen=Math.max(30,bottomY-topY);
    const cxAt=t=>arm.sh.x+(arm.wr.x-arm.sh.x)*Math.max(0,Math.min(1,t));
    const droopMax=armLen*(0.20+0.30*DROOP);   // ระยะแขนตกลงมากสุด (คงที่ ชัดเจน)
    const inwardMax=shoulderW*0.12*DROOP;       // แขนสางเข้าหาลำตัวเล็กน้อย (limp)
    const xL=Math.min(arm.sh.x,arm.el.x,arm.wr.x)-armHalfW;
    const xR=Math.max(arm.sh.x,arm.el.x,arm.wr.x)+armHalfW;

    // copy clean frame to tmp, then warp arm region on top
    tctx.setTransform(1,0,0,1,0,0);tctx.clearRect(0,0,W,H);tctx.drawImage(canvas,0,0);
    const cols=6,rows=11,src=[],dst=[];
    for(let j=0;j<=rows;j++){src.push([]);dst.push([]);
      for(let i=0;i<=cols;i++){
        const x=xL+(xR-xL)*i/cols,y=topY+armLen*j/rows;
        src[j].push({x,y});
        const t=(y-topY)/armLen;                    // 0 บน(ไหล่) .. 1 ล่าง(มือ)
        const cx=cxAt(t);
        const wx=Math.exp(-Math.pow((x-cx)/armHalfW,2)*2.2);   // เฉพาะแนวแขน (feather เข้าพื้นหลัง)
        const wt=0.40+0.60*Math.pow(Math.max(0,t),1.25);       // หัวไหล่ (บนสุด) เลื่อนลงชัด (base 0.40) ปลายแขนตกมากสุด
        const w=wt*wx*e;
        const dy=droopMax*w;
        const dx=inwardMax*w*Math.sign(bodyCx-cx);
        dst[j].push({x:x+dx,y:y+dy});
      }
    }
    for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){
      const a=src[j][i],b=src[j][i+1],c=src[j+1][i],d=src[j+1][i+1];
      const A=dst[j][i],B=dst[j][i+1],C=dst[j+1][i],D=dst[j+1][i+1];
      drawTriTex(cctx,tmp,[a,b,d],[A,B,D]);
      drawTriTex(cctx,tmp,[a,d,c],[A,D,C]);
    }
    cctx.setTransform(1,0,0,1,0,0);
    const sideTxt=side==='left'?'ซ้าย':'ขวา';
    banner(droopT>0.6?('แขน'+sideTxt+'อ่อนแรง (จำลอง)'):'กำลังจำลอง...',droopT>0.6);
    _raf=requestAnimationFrame(frame);
  }

  // start camera + model
  (async()=>{
    try{
      let stream;try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});}
      catch(e){stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});}
      _stream=stream;video.srcObject=stream;await video.play();
      await new Promise(r=>{if(video.videoWidth)r();else video.onloadedmetadata=r;});
      syncCanvas(canvas);
      getPoseLM().then(()=>{ready=true;statusEl.textContent='วางแขนแนบลำตัว แล้วดูอาการ';})
        .catch(()=>{useMP=false;ready=true;statusEl.textContent=NET_MSG;});
      _raf=requestAnimationFrame(frame);
    }catch(err){
      app.innerHTML='';
      app.append(h('div',{class:'intro'},
        h('h1',null,'เข้าถึงกล้องไม่ได้'),
        h('p',null,'กรุณาอนุญาตการใช้กล้อง และเปิดผ่าน HTTPS'),
        h('button',{class:'btn ghost',html:'ย้อนกลับ',onclick:showIntro})));
    }
  })();
}

/* ---------- fit ---------- */
showIntro();
</script>
</body>
</html>
